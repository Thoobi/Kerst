name: Release Download Guard

# The website's download buttons link to fixed filenames under
# downloads.litdeck.space/latest/ (web/app/_lib/site.ts), and the site is a
# static export — it cannot check at runtime whether those files exist.
#
# The release workflow uploads every build to /v<version>/ in download storage
# but never touches /latest/. Publishing the release is the human "ship it":
# this job then checks that the version has every file the site links to and,
# only if it does, copies them to /latest/. An incomplete release is reverted
# to draft instead and /latest/ stays on the last complete one. Nothing is
# lost: re-run the failed build job, then publish again.
#
# Setup and the secrets this needs: documentation/downloads.md.

on:
  release:
    # Deliberately not `edited`: this job edits the release, which would
    # retrigger itself.
    types: [published, released]
  # Re-publish an already published release to /latest/, e.g. after adding a
  # file to what /latest/ carries. It never reverts anything to draft.
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to serve from /latest/ (e.g. v0.3.2)
        required: true

permissions:
  contents: write

concurrency:
  # Two publishes racing could leave /latest/ with files from both.
  group: publish-downloads
  cancel-in-progress: false

jobs:
  publish-downloads:
    name: Verify and publish site downloads
    # Prereleases never become what the site offers.
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      RELEASE_ID: ${{ github.event.release.id }}
      BUCKET: ${{ secrets.DOWNLOADS_S3_BUCKET }}
      ENDPOINT: ${{ secrets.DOWNLOADS_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.DOWNLOADS_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.DOWNLOADS_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.DOWNLOADS_S3_REGION || 'auto' }}
      # R2 rejects the CRC checksums newer AWS CLIs send by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required

    steps:
      - name: Check every platform the site links to
        id: check
        shell: bash
        run: |
          if [[ -z "$BUCKET" || -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::error::Download storage secrets are not set, so ${TAG} cannot" \
                 "be published to the website. See documentation/downloads.md." \
                 "The release stays published on GitHub; the site keeps offering" \
                 "whatever /latest/ already holds."
            exit 1
          fi

          # Keep in sync with the `aliases` list in build-release.yml and the
          # download URLs in web/app/_lib/site.ts.
          required=(
            Litdeck-windows-x64-setup.exe
            Litdeck-macos-arm64.dmg
            Litdeck-linux-x86_64.AppImage
          )

          # Keep only scheme://host: R2's dashboard shows the S3 API URL with
          # "/<bucket>" on the end, and a path here gets prepended to every key.
          ENDPOINT=$(sed -E 's#^(https?://[^/]+).*#\1#' <<< "$ENDPOINT")
          endpoint=()
          [[ -n "$ENDPOINT" ]] && endpoint=(--endpoint-url "$ENDPOINT")

          # Never act on a failed lookup: a storage hiccup would otherwise read
          # as "every file is missing" and unpublish a perfectly good release.
          # list-objects-v2 succeeds on an empty prefix (unlike `aws s3 ls`), so
          # a non-zero exit here really is a storage or credentials problem.
          if ! keys=$(aws s3api list-objects-v2 "${endpoint[@]}" \
            --bucket "$BUCKET" --prefix "${TAG}/" \
            --query 'Contents[].Key' --output text); then
            echo "::error::Could not list ${TAG}/ in download storage. Leaving the" \
                 "release as published and failing this check instead of guessing."
            exit 1
          fi

          present=$(tr '\t' '\n' <<< "${keys}" | { grep -v '^None$' || true; } | sed "s#^${TAG}/##")
          echo "Files in ${TAG}/:"
          echo "${present}" | sed 's/^/  /'

          # The Linux packages the site's install commands fetch. Optional:
          # matched by pattern so releases from before they had stable names
          # still provide them, and a missing one never blocks a release.
          deb=$(grep -E '_amd64\.deb$' <<< "${present}" | head -1 || true)
          rpm=$(grep -E '\.x86_64\.rpm$' <<< "${present}" | head -1 || true)
          echo "deb=${deb}" >> "$GITHUB_OUTPUT"
          echo "rpm=${rpm}" >> "$GITHUB_OUTPUT"
          [[ -n "$deb" ]] || echo "::warning::No .deb in ${TAG}/; /latest/ keeps its previous one."
          [[ -n "$rpm" ]] || echo "::warning::No .rpm in ${TAG}/; /latest/ keeps its previous one."

          missing=()
          for name in "${required[@]}"; do
            grep -qxF "$name" <<< "${present}" || missing+=("$name")
          done

          if [[ ${#missing[@]} -eq 0 ]]; then
            echo "All ${#required[@]} site download targets present in ${TAG}/."
            exit 0
          fi

          echo "::error::${TAG} is missing ${missing[*]}, which the website's" \
               "download buttons link to. Reverting the release to draft and" \
               "leaving /latest/ on the last complete release. To fix: open the" \
               "'Build, Bundle and Release' run for ${TAG}, choose 'Re-run failed" \
               "jobs' (not 'Re-run all jobs' — that discards the artifacts the" \
               "other platforms already built), then publish again."

          # Run by hand, there is no release event to undo; just stop.
          if [[ -n "$RELEASE_ID" ]]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
              -F draft=true > /dev/null
            echo "${TAG} reverted to draft."
          fi
          exit 1

      - name: Copy to /latest/
        shell: bash
        env:
          DEB: ${{ steps.check.outputs.deb }}
          RPM: ${{ steps.check.outputs.rpm }}
        run: |
          # Keep only scheme://host: R2's dashboard shows the S3 API URL with
          # "/<bucket>" on the end, and a path here gets prepended to every key.
          ENDPOINT=$(sed -E 's#^(https?://[^/]+).*#\1#' <<< "$ENDPOINT")
          endpoint=()
          [[ -n "$ENDPOINT" ]] && endpoint=(--endpoint-url "$ENDPOINT")

          # /latest/ changes with every release, so keep caches short; the
          # versioned copies under /v<version>/ are the long-lived ones.
          for name in Litdeck-windows-x64-setup.exe Litdeck-macos-arm64.dmg Litdeck-linux-x86_64.AppImage; do
            aws s3 cp "s3://${BUCKET}/${TAG}/${name}" "s3://${BUCKET}/latest/${name}" \
              "${endpoint[@]}" --no-progress \
              --cache-control "public, max-age=300" \
              --metadata-directive REPLACE \
              --content-disposition "attachment; filename=\"${name}\""
          done

          # Optional Linux packages, under stable names whatever the release
          # called them.
          for pair in "${DEB}:Litdeck-linux-amd64.deb" "${RPM}:Litdeck-linux-x86_64.rpm"; do
            src="${pair%%:*}"
            name="${pair##*:}"
            [[ -n "$src" ]] || continue
            aws s3 cp "s3://${BUCKET}/${TAG}/${src}" "s3://${BUCKET}/latest/${name}" \
              "${endpoint[@]}" --no-progress \
              --cache-control "public, max-age=300" \
              --metadata-directive REPLACE \
              --content-disposition "attachment; filename=\"${name}\""
          done

          # A small manifest so anything (the site, the app) can ask what the
          # current version is without parsing a filename.
          printf '{\n  "version": "%s",\n  "published_at": "%s"\n}\n' \
            "${TAG#v}" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > latest.json
          aws s3 cp latest.json "s3://${BUCKET}/latest/latest.json" \
            "${endpoint[@]}" --no-progress \
            --content-type application/json --cache-control "public, max-age=60"

          echo "/latest/ now serves ${TAG}."
