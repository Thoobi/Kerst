[workspace]
members = [
    ".",
    "crates/audio",
    "crates/stt",
    "crates/bible",
    "crates/detection",
    "crates/broadcast",
    "crates/api",
    "crates/notes",
    "crates/library",
    "crates/stream",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allow common patterns that pedantic warns about
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[package]
name = "litdeck"
version = "0.4.2"
description = "Litdeck - Real-Time AI Bible Verse Detection"
authors = ["Faithful"]
license = "MIT"
repository = "https://github.com/Thoobi/Kerst"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "litdeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Litdeck"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json.workspace = true
serde.workspace = true
log.workspace = true
tokio.workspace = true
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
litdeck-audio = { path = "crates/audio" }
litdeck-bible = { path = "crates/bible" }
litdeck-library = { path = "crates/library" }
litdeck-stt = { path = "crates/stt" }
litdeck-broadcast = { path = "crates/broadcast" }
litdeck-stream = { path = "crates/stream" }
litdeck-detection = { path = "crates/detection", features = ["onnx", "vector-search"] }
litdeck-api = { path = "crates/api" }
crossbeam-channel = "0.5"
dotenvy = "0.15"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
fontdb = "0.24.0"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
uuid = { version = "1.24", features = ["v4"] }
# Already built by litdeck-stt; used for the first-use Whisper model download.
reqwest = { version = "0.12", features = ["stream"] }
futures-util = "0.3"
sha2 = "0.10"

[features]
default = ["whisper"]
whisper = ["litdeck-stt/whisper"]

[lints]
workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
tauri-plugin-process = "~2.3"
tauri-plugin-updater = "~2.12"

# Output windows turn off WebKit's hidden-page timer throttling; see
# `commands::broadcast::keep_running_when_hidden`.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"
libc = "0.2"

# whisper.cpp built at -O0 transcribes ~20x slower than real time; keep it optimized in dev.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
