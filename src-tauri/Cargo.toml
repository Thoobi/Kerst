[workspace]
members = [
    ".",
    "crates/audio",
    "crates/stt",
    "crates/bible",
    "crates/detection",
    "crates/broadcast",
    "crates/api",
    "crates/notes",
    "crates/library",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allow common patterns that pedantic warns about
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[package]
name = "light"
version = "0.3.2"
description = "Light - Real-Time AI Bible Verse Detection"
authors = ["Faithful"]
license = "MIT"
repository = "https://github.com/openbezal/rhema"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "light_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "Light"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json.workspace = true
serde.workspace = true
log.workspace = true
tokio.workspace = true
tauri = { version = "2.10.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
light-audio = { path = "crates/audio" }
light-bible = { path = "crates/bible" }
light-library = { path = "crates/library" }
light-stt = { path = "crates/stt" }
light-broadcast = { path = "crates/broadcast" }
light-detection = { path = "crates/detection", features = ["onnx", "vector-search"] }
light-api = { path = "crates/api" }
crossbeam-channel = "0.5"
dotenvy = "0.15"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
fontdb = "0.24.0"
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
uuid = { version = "1.24", features = ["v4"] }

[features]
default = ["whisper"]
whisper = ["light-stt/whisper"]

[lints]
workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"
